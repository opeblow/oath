[package]
name = "oath-token"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OATH: a memecoin whose creator promises are contract rules"
repository = "https://github.com/opeblow/oath"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
uint = { version = "0.10.2", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
