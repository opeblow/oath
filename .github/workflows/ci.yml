name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 5173 --strictPort &
          npx wait-on http://localhost:5173
          node scripts/smoke.mjs

  mcp:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mcp/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test

  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts }
      - run: cargo test
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - run: cd token && cargo near build non-reproducible-wasm
      - run: cd factory && cargo near build non-reproducible-wasm
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sandbox end-to-end tests
        working-directory: contracts/sandbox-tests
        run: npm install && npm test

  auditor:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: auditor } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip1 }
      - run: cargo build --release
      - run: cargo build --release --target wasm32-wasip1
      - run: parity/check.sh
